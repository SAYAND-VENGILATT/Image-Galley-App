version: 0.0
os: linux

file_exist_behavior=overwrite
files:
  - source: /
    destination: /home/django-user/Image-Galley-App

hooks:

  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 120
      runas: root

  AfterInstall:
    - location: scripts/install_dependencies.sh
      timeout: 600
      runas: root

  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 120
      runas: root

  ValidateService:
    - location: scripts/validate_application.sh
      timeout: 120
      runas: root
